name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  code-quality:
    name: 1. check code quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint

  build-tests:
    name: 2. build tests
    runs-on: ubuntu-latest
    needs: code-quality
    env:
      HEADLESS: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run @build scenarios
        run: npm run test -- --tags "@build"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: reports/dashboard/

  regression-tests:
    name: 3. regression tests
    runs-on: ubuntu-latest
    needs: build-tests
    env:
      HEADLESS: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run @regression scenarios
        run: npm run test -- --tags "@regression"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report
          path: reports/dashboard/
